version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: jobfit-postgres
    restart: always
    environment:
      POSTGRES_USER: jobfit
      POSTGRES_PASSWORD: jobfitpassword
      POSTGRES_DB: jobfit_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jobfit-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://jobfit:jobfitpassword@postgres:5432/jobfit_db
      - EMBEDDING_MODEL_NAME=BAAI/bge-small-en-v1.5
      - LLM_PROVIDER=gemini
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - NEMOTRON_API_KEY=${NEMOTRON_API_KEY:-}
    depends_on:
      - postgres
    volumes:
      - ./data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jobfit-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
